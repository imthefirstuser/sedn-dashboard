let curFilter='all',curSort=-1,sortAsc=true;
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  let d=DATA.filter(r=>{
    if(curFilter!=='all'&&r['类型']!==curFilter)return false;
    if(!q)return true;
    return(r['品号']+' '+r['品名']+' '+r['单号']+' '+r['供应商']).toLowerCase().includes(q);
  });
  if(curSort>=0){
    const keys=['','类型','单号','品号','品名','规格','数量','供应商','交货日','逾期天数','含税单价'];
    const k=keys[curSort];
    d.sort((a,b)=>{
      let va=a[k],vb=b[k];
      if(typeof va==='number')return sortAsc?va-vb:vb-va;
      return sortAsc?String(va).localeCompare(String(vb)):String(vb).localeCompare(String(va));
    });
  }
  const tb=document.getElementById('tbody');
  tb.innerHTML=d.map((r,i)=>`<tr>
    <td class="num">${i+1}</td>
    <td><span class="tag tag-${r['类型']==='逾期'?'overdue':'approaching'}">${r['类型']}</span></td>
    <td>${r['单号']}</td><td>${r['品号']}</td><td>${r['品名']}</td><td>${r['规格']}</td>
    <td class="num">${r['数量']}</td><td>${r['供应商']}</td><td>${r['交货日']}</td>
    <td class="num">${r['逾期天数']>0?r['逾期天数']+'天':'-'}</td>
    <td class="num">${r['含税单价']>0?'¥'+r['含税单价'].toFixed(2):'-'}</td>
  </tr>`).join('');
  document.getElementById('count').textContent='显示 '+d.length+'/'+DATA.length;
}
function filter(f){curFilter=f;document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
document.querySelector('.btn-'+(f==='all'?'all':f==='逾期'?'overdue':'approaching')).classList.add('active');render();}
function sort(col){if(curSort===col)sortAsc=!sortAsc;else{curSort=col;sortAsc=true;}render();}
document.getElementById('search').addEventListener('input',render);
render();
</script></body></html>
