<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采购到货预警</title>
<style>
:root {
  --bg: #F4F3F0;
  --surface: #FFFFFF;
  --border: #E6E5E0;
  --border-light: #EFEEEA;
  --text: #1C1B1A;
  --text-secondary: #6B6A66;
  --text-muted: #A3A29E;
  --red: #C43A31;
  --red-bg: #FFF5F5;
  --amber: #C4872B;
  --amber-bg: #FFFBF0;
  --green: #1B8A3D;
  --blue: #2563EB;
  --font: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;padding:32px 0}
.app{max-width:1100px;margin:0 auto;padding:0 20px}

/* Header */
.header{margin-bottom:24px}
.header h1{font-size:17px;font-weight:500;letter-spacing:-0.01em;color:var(--text);margin-bottom:3px}
.header .sub{font-size:12px;color:var(--text-muted);margin-bottom:10px}

/* Stats */
.stats-line{display:flex;gap:20px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border-light)}
.stat{flex:1;min-width:0;text-align:left}
.stat-value{font-size:27px;font-weight:450;letter-spacing:-0.03em;font-feature-settings:"tnum" 1}
.stat-value.red{color:var(--red)}
.stat-value.amber{color:var(--amber)}
.stat-value.green{color:var(--green)}
.stat-value.muted{color:var(--text-muted)}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:0}

/* Controls */
.controls{display:flex;gap:8px;align-items:center;margin-bottom:24px;font-size:13px;flex-wrap:wrap}
.controls input{flex:1;max-width:240px;padding:6px 10px;border:1px solid var(--border);border-radius:0;font-size:13px;font-family:var(--font);background:var(--surface);color:var(--text);outline:none}
.controls input:focus{border-color:var(--text-secondary)}
.filter-group{display:flex;gap:4px}
.filter-btn{padding:5px 12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;color:var(--text-secondary);font-family:var(--font)}
.filter-btn.active{background:var(--text);color:var(--surface);border-color:var(--text)}
.filter-btn:hover{border-color:var(--text-secondary)}
.result-count{font-size:12px;color:var(--text-muted);margin-left:auto}

/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--border-light);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:var(--surface);color:var(--text-secondary);font-weight:400;padding:8px 10px;text-align:left;font-size:11px;letter-spacing:0.3px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--text)}
thead th .sort-icon{font-size:9px;margin-left:3px;opacity:0.4}
thead th.sorted .sort-icon{opacity:1;color:var(--text)}
tbody td{padding:7px 10px;border-bottom:1px solid var(--border-light);font-feature-settings:"tnum" 1;white-space:nowrap}
tbody tr:hover{background:#FAFAF8}
td.num{text-align:right}
td.overdue-days{color:var(--red);font-weight:500}
td.approaching-days{color:var(--amber);font-weight:500}
td.due-date{font-size:11.5px}
td.item-name{max-width:180px;overflow:hidden;text-overflow:ellipsis}
td.supplier{max-width:100px;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary)}
td.order-no{font-feature-settings:"tnum" 1;font-size:11.5px;color:var(--text-secondary)}

/* Section */
.section-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title .badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:500}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.section{margin-bottom:32px}

/* Responsive */
@media(max-width:640px){
  body{padding:16px 0;overflow-x:auto}
  .stats-line{gap:12px;flex-wrap:wrap}
  .stat-value{font-size:22px}
  .controls{flex-wrap:wrap}
  .controls input{max-width:100%}
  table{font-size:11px}
  td,th{padding:5px 6px}
}
</style>
</head>

<div class="app">
<div class="header">
  <h1>采购到货预警</h1>

<div id="content"></div>
</div>

function getRows() {
  let rows = [];
  if (filter === 'all' || filter === 'overdue') rows = rows.concat(OVERDUE.map(r => ({...r, _type:'overdue'})));
  if (filter === 'all' || filter === 'approaching') rows = rows.concat(APPROACHING.map(r => ({...r, _type:'approaching'})));
  return rows;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  let rows = getRows();
  if (q) rows = rows.filter(r =>
    (r['品号']||'').toLowerCase().includes(q) ||
    (r['品名']||'').toLowerCase().includes(q) ||
    (r['供应商']||'').toLowerCase().includes(q) ||
    (r['单号']||'').toLowerCase().includes(q)
  );
  // sort
  rows.sort((a,b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (typeof va === 'number' && typeof vb === 'number') return sortAsc ? va-vb : vb-va;
    va = String(va||''); vb = String(vb||'');
    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });

  document.getElementById('count').textContent = rows.length + ' 笔';

  // Group: overdue first, then approaching
  const odRows = rows.filter(r => r._type === 'overdue');
  const apRows = rows.filter(r => r._type === 'approaching');

  let html = '';

  if (odRows.length > 0) {
    html += '<div class="section">';
    html += '<div class="section-title"><span class="badge red">' + odRows.length + '</span> 逾期未到</div>';
    html += buildTable(odRows, true);
    html += '</div>';
  }
  if (apRows.length > 0) {
    html += '<div class="section">';
    html += '<div class="section-title"><span class="badge amber">' + apRows.length + '</span> 临期未到（3天内）</div>';
    html += buildTable(apRows, false);
    html += '</div>';
  }
  if (!odRows.length && !apRows.length) {
    html = '<div style="text-align:center;padding:60px;color:var(--text-muted)">无匹配数据</div>';
  }

  document.getElementById('content').innerHTML = html;
}

function buildTable(rows, isOverdue) {
  let h = '<div class="table-wrap"><table><thead><tr>';
  const cols = ['单号','品号','品名','规格','数量','供应商','交货日'];
  if (isOverdue) cols.push('逾期天数');
  else cols.push('剩余天数');
  cols.push('含税单价');
  cols.forEach(c => {
    const cls = sortCol === c ? ' class="sorted"' : '';
    h += '<th' + cls + ' onclick="doSort(\'' + c + '\')">' + c + '<span class="sort-icon">' + (sortCol===c ? (sortAsc?'▲':'▼') : '↕') + '</span></th>';
  });
  h += '</tr></thead><tbody>';
  rows.forEach(r => {
    h += '<tr>';
    h += '<td class="order-no">' + (r['单号']||'') + '</td>';
    h += '<td>' + (r['品号']||'') + '</td>';
    h += '<td class="item-name">' + (r['品名']||'') + '</td>';
    h += '<td class="item-name">' + (r['规格']||'') + '</td>';
    h += '<td class="num">' + (r['数量']||0) + '</td>';
    h += '<td class="supplier">' + (r['供应商']||'') + '</td>';
    h += '<td class="due-date">' + (r['交货日']||'') + '</td>';
    if (isOverdue) {
      h += '<td class="num overdue-days">' + (r['逾期天数']||0) + '天</td>';
    } else {
      const d = r['剩余天数'] !== undefined ? r['剩余天数'] : '';
      h += '<td class="num approaching-days">' + (d === 0 ? '今天' : d + '天') + '</td>';
    }
    const price = r['含税单价'];
    h += '<td class="num">' + (price && price > 0 ? price.toFixed(2) : '-') + '</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function doSort(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  render();
}

render();
</script>
</body>
</html>
