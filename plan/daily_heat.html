function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
let pinned = null;             // 已钉住的格子
document.body.addEventListener('mouseover', e => {
  if(pinned) return;           // 钉住期间不跟随其它格
  const td = e.target.closest('td[data-cat]');
  if(!td) { tip.style.display='none'; return; }

  const S = [], O = [];
  ps.forEach(p => {
    ((D.sd[p]||{})[d]||[]).forEach(x => S.push(x));

  const col = arr => arr.length ? arr.join('<br>') : '<span style="color:#5b6875">—</span>';

  let rows = '';

  for(let i=0;i<n;i++) rows += `<tr><td>${S[i]!==undefined ? esc(cut(S[i])) : ''}</td><td>${O[i]!==undefined ? esc(cut(O[i])) : ''}</td></tr>`;

    `<table><tr><th>型号 S 开头 · <span class="sum">${td.dataset.s} 件</span></th>` +
    `<th>其他型号 · <span class="sum">${td.dataset.o} 件</span></th></tr>` + rows + '</table>';

    tip.innerHTML = `<div class="hd">${d} · ${ps[0]} 0 件</div><div style="color:#5b6875">当天无安排（0 件）</div>`;
  }
  window.__tipCell = td;
  tip.style.display = 'block';
  place(tip, td, e);
});
// 浮层定位：优先在格子右侧，右边放不下自动翻到左侧；上下同理
function place(el, cell, e){
  const W = el.offsetWidth, H = el.offsetHeight;
  const r = cell.getBoundingClientRect();
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  const cx = Math.max(0, Math.min(e ? e.clientX : r.left, vw - 2));   // 鼠标可能被夹到视口外
  let x = cx + 14;
  const y0 = (e ? e.clientY : r.top) + 14;
  if (x + W > vw - 6) x = cx - 14 - W;                   // 右侧放不下 → 翻到左边
  if (x < 6) x = Math.max(6, vw - W - 6);                // 左边也放不下 → 贴右边界内
  let y = y0;
  if (y + H > vh - 6) y = Math.max(6, vh - H - 6);        // 贴底 → 往上
  el.style.left = Math.round(x) + 'px';
  el.style.top = Math.round(y) + 'px';
}
document.addEventListener('mousemove', e => {
  if(pinned || tip.style.display !== 'block') return;
  if(window.__tipCell) place(tip, window.__tipCell, e);
});
document.addEventListener('mouseout', e => { if(!pinned && e.target.closest && e.target.closest('td[data-cat]')) tip.style.display='none'; });

// —— 点击钉住：浮层内可滚动看全；点浮层外或再点同格关闭 ——
document.body.addEventListener('click', e => {
  const td = e.target.closest('td[data-cat]');
  if(td){
    if(pinned === td){ pinned = null; tip.style.display='none'; tip.classList.remove('pin'); return; }
    pinned = td;
    tip.classList.add('pin');
    tip.style.display = 'block';
    tip.innerHTML = tip.innerHTML;      // 保持不变
    place(tip, td, {clientX: e.clientX || td.getBoundingClientRect().left, clientY: e.clientY || td.getBoundingClientRect().top});
    e.stopPropagation();
    return;
  }
  if(pinned && !e.target.closest('#tip')){
    pinned = null; tip.style.display='none'; tip.classList.remove('pin');
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && pinned){ pinned = null; tip.style.display='none'; tip.classList.remove('pin'); }
});
window.addEventListener('scroll', (e) => {
  if(pinned) return;                      // 钉住时不收起
  if(e.target && e.target.id === 'tip') return;
  tip.style.display='none';
}, true);   // 滚动时收起，避免浮层错位
