<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采购底稿下单情况</title>
<style>
:root {
  --bg: #F4F3F0;
  --surface: #FFFFFF;
  --border: #E6E5E0;
  --border-light: #EFEEEA;
  --text: #1C1B1A;
  --text-secondary: #6B6A66;
  --text-muted: #A3A29E;
  --red: #C43A31;
  --red-bg: #FFF5F5;
  --amber: #C4872B;
  --amber-bg: #FFFBF0;
  --green: #1B8A3D;
  --green-bg: #F0FFF4;
  --blue: #2563EB;
  --font: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;padding:32px 0}
.app{max-width:1100px;margin:0 auto;padding:0 20px}
.header{margin-bottom:24px}
.header h1{font-size:17px;font-weight:500;letter-spacing:-0.01em;margin-bottom:3px}
.header .sub{font-size:12px;color:var(--text-muted);margin-bottom:10px}
.stats-line{display:flex;gap:20px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border-light)}
.stat{flex:1;min-width:0}
.stat-value{font-size:27px;font-weight:450;letter-spacing:-0.03em;font-feature-settings:"tnum" 1}
.stat-value.red{color:var(--red)}
.stat-value.amber{color:var(--amber)}
.stat-value.green{color:var(--green)}
.stat-value.muted{color:var(--text-muted)}
.stat-label{font-size:11px;color:var(--text-muted)}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:24px;font-size:13px;flex-wrap:wrap}
.controls input{flex:1;max-width:280px;padding:6px 10px;border:1px solid var(--border);font-size:13px;font-family:var(--font);background:var(--surface);color:var(--text);outline:none}
.controls input:focus{border-color:var(--text-secondary)}
.filter-group{display:flex;gap:4px}
.filter-btn{padding:5px 12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;color:var(--text-secondary);font-family:var(--font)}
.filter-btn.active{background:var(--text);color:var(--surface);border-color:var(--text)}
.result-count{font-size:12px;color:var(--text-muted);margin-left:auto}

/* Order card */
.order-card{background:var(--surface);border:1px solid var(--border-light);margin-bottom:16px;overflow:hidden}
.order-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border-light)}
.order-header:hover{background:#FAFAF8}
.order-id{font-size:13px;font-weight:500;font-feature-settings:"tnum" 1}
.order-meta{display:flex;gap:16px;font-size:11px;color:var(--text-secondary)}
.order-meta .gap{color:var(--red);font-weight:500}
.order-meta .ok{color:var(--green)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:9px;font-size:10px;font-weight:500;margin-left:8px}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.green{background:var(--green-bg);color:var(--green)}

.order-body{display:none;padding:0}
.order-body.open{display:block}
.section-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);padding:10px 16px 6px;background:var(--bg)}

/* Tables inside order */
.sub-table{width:100%;border-collapse:collapse;font-size:12px}
.sub-table th{color:var(--text-secondary);font-weight:400;padding:5px 12px;text-align:left;font-size:10px;letter-spacing:0.3px;border-bottom:1px solid var(--border-light);background:var(--surface)}
.sub-table td{padding:5px 12px;border-bottom:1px solid var(--border-light);font-feature-settings:"tnum" 1}
.sub-table td:first-child{font-weight:450}
.sub-table tr:hover{background:#FAFAF8}
td.num{text-align:right}
td.item-code{color:var(--text-secondary);font-size:11px}
td.item-name{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.gap{color:var(--red)}
td.ok{color:var(--green)}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.green{background:var(--green-bg);color:var(--green)}

.toggle-icon{font-size:11px;color:var(--text-muted);transition:transform 0.15s}
.toggle-icon.open{transform:rotate(90deg)}

@media(max-width:640px){
  .stats-line{gap:12px;flex-wrap:wrap}
  .stat-value{font-size:20px}
  .controls{flex-wrap:wrap}
  .sub-table{font-size:11px}
}
</style>
</head>

    o.dd.toLowerCase().includes(q) ||
    o.products.some(p => (p.code||'').toLowerCase().includes(q) || (p.name||'').toLowerCase().includes(q)) ||
    o.missing_items.some(m => (m.material||'').toLowerCase().includes(q) || (m.name||'').toLowerCase().includes(q))
  );

  document.getElementById('count').textContent = orders.length + ' 单';

  let html = '';
  orders.forEach(o => {
    const hasGap = o.missing_materials > 0;
    const gapBadge = hasGap ? '<span class="badge red">' + o.missing_materials + '</span>' : '<span class="badge green">✓</span>';
    const prodStr = o.products.slice(0,3).map(p => (p.name||p.code)).join(', ') + (o.products.length > 3 ? '…' : '');
    
    html += '<div class="order-card">';
    html += '<div class="order-header" onclick="toggleOrder(this)">';
    html += '<div><span class="order-id">' + o.dd + '</span>' + gapBadge + '</div>';
    html += '<div class="order-meta">';
    html += '<span>' + o.products.length + '个产品</span>';
    if (hasGap) html += '<span class="gap">缺' + o.missing_materials + '种底稿</span>';
    html += '<span>' + o.hcb_count + '笔底稿</span>';
    if (o.hcb_unfilled > 0) html += '<span class="gap">' + o.hcb_unfilled + '未交</span>';
    html += '<span class="toggle-icon">▶</span>';
    html += '</div></div>';
    
    html += '<div class="order-body">';
    
    // Products
    html += '<div class="section-label">产品明细</div>';
    html += '<table class="sub-table"><thead><tr><th>品号</th><th>品名</th><th>规格</th><th style="text-align:right">数量</th></tr></thead><tbody>';
    o.products.forEach(p => {
      html += '<tr><td class="item-code">' + p.code + '</td><td class="item-name">' + (p.name||'') + '</td><td class="item-name">' + (p.spec||'') + '</td><td class="num">' + (p.qty%1===0?p.qty.toFixed(0):p.qty.toFixed(1)) + '</td></tr>';
    });
    html += '</tbody></table>';
    
    // Missing materials
    if (o.missing_items && o.missing_items.length > 0) {
      html += '<div class="section-label">缺采购底稿物料 <span class="tag red">' + o.missing_items.length + '种</span></div>';
      html += '<table class="sub-table"><thead><tr><th>品号</th><th>品名</th><th>规格</th><th style="text-align:right">需求量</th></tr></thead><tbody>';
      o.missing_items.forEach(m => {
        html += '<tr><td class="item-code">' + m.material + '</td><td class="item-name">' + (m.name||'') + '</td><td class="item-name">' + (m.spec||'') + '</td><td class="num gap">' + (m.needed%1===0?m.needed.toFixed(0):m.needed.toFixed(1)) + '</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<div class="section-label"><span class="tag green">所有物料已有底稿</span></div>';
    }
    
    html += '</div></div>';
  });
  
  if (!orders.length) html = '<div style="text-align:center;padding:60px;color:var(--text-muted)">无匹配数据</div>';
  document.getElementById('content').innerHTML = html;
}

render();
</script>
</body>
</html>
