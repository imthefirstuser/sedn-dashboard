let curSort=7,sortAsc=false;
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  let d=DATA.filter(r=>{
    if(!q)return true;
    return(r['品号']+' '+r['品名']+' '+r['规格']).toLowerCase().includes(q);
  });
  if(curSort>=0){
    const keys=['序号','品号','品名','规格','需求','库存','已底稿','缺口'];
    const k=keys[curSort];
    d.sort((a,b)=>{
      let va=a[k],vb=b[k];
      if(typeof va==='number')return sortAsc?va-vb:vb-va;
      return sortAsc?String(va).localeCompare(String(vb)):String(vb).localeCompare(String(va));
    });
  }
  const tb=document.getElementById('tbody');
  tb.innerHTML=d.map((r,i)=>`<tr>
    <td class="num">${i+1}</td>
    <td>${r['品号']}</td><td>${r['品名']}</td><td>${r['规格']}</td>
    <td class="num">${r['需求']}</td>
    <td class="num">${r['库存']}</td>
    <td class="num">${r['已底稿']}</td>
    <td class="num gap-val">${r['缺口']}</td>
  </tr>`).join('');
  document.getElementById('count').textContent='显示 '+d.length+'/'+DATA.length;
}
function sort(col){if(curSort===col)sortAsc=!sortAsc;else{curSort=col;sortAsc=col<4;}render();}
