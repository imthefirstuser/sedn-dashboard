  --red: #C43A31; --red-bg: #FFF5F5; --amber: #C4872B; --amber-bg: #FFFBF0;
  --green: #1B8A3D; --green-bg: #F0FFF4;
  --font: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;padding:32px 0}
.app{max-width:1100px;margin:0 auto;padding:0 20px}
.header{margin-bottom:24px}
.header h1{font-size:17px;font-weight:500;margin-bottom:3px}
.header .sub{font-size:12px;color:var(--text-muted);margin-bottom:10px}
.stats-line{display:flex;gap:20px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border-light)}
.stat{flex:1;min-width:0}
.stat-value{font-size:27px;font-weight:450;font-feature-settings:"tnum" 1}
.stat-value.red{color:var(--red)}
.stat-value.amber{color:var(--amber)}
.stat-value.muted{color:var(--text-muted)}
.stat-label{font-size:11px;color:var(--text-muted)}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:24px;font-size:13px;flex-wrap:wrap}
.controls input{flex:1;max-width:280px;padding:6px 10px;border:1px solid var(--border);font-size:13px;font-family:var(--font);background:var(--surface);outline:none}
.controls input:focus{border-color:var(--text-secondary)}
.filter-group{display:flex;gap:4px}
.filter-btn{padding:5px 12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;color:var(--text-secondary);font-family:var(--font)}
.filter-btn.active{background:var(--text);color:var(--surface);border-color:var(--text)}
.result-count{font-size:12px;color:var(--text-muted);margin-left:auto}

.order-card{background:var(--surface);border:1px solid var(--border-light);margin-bottom:12px}
.order-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;cursor:pointer}
.order-header:hover{background:#FAFAF8}
.order-id{font-size:13px;font-weight:500;font-feature-settings:"tnum" 1}
.order-meta{display:flex;gap:14px;font-size:11px;color:var(--text-secondary);align-items:center}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:9px;font-size:10px;font-weight:500;margin-left:8px}
.badge.red{background:var(--red-bg);color:var(--red)}
.toggle-icon{font-size:11px;color:var(--text-muted);transition:transform 0.15s}
.toggle-icon.open{transform:rotate(90deg)}
.order-body{display:none;padding:0}
.order-body.open{display:block}
.sub-table{width:100%;border-collapse:collapse;font-size:12px}
.sub-table th{color:var(--text-secondary);font-weight:400;padding:6px 12px;text-align:left;font-size:10px;letter-spacing:0.3px;border-bottom:1px solid var(--border-light)}
.sub-table td{padding:6px 12px;border-bottom:1px solid var(--border-light);font-feature-settings:"tnum" 1}
.sub-table tr:hover{background:#FAFAF8}
td.code{color:var(--text-secondary);font-size:11px}
td.name{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.num{text-align:right}

@media(max-width:640px){
  .stats-line{gap:12px;flex-wrap:wrap}
  .stat-value{font-size:20px}
}
</style>
</head>

let filter = 'gap';
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  render();
}
function toggleOrder(el) {
  const body = el.nextElementSibling;
  const icon = el.querySelector('.toggle-icon');
  body.classList.toggle('open');
  icon.classList.toggle('open');
}
function render() {
  const q = document.getElementById('search').value.toLowerCase();
  let orders = filter === 'gap' ? ORDERS.filter(o => o.status === 'no_hcb') : ORDERS;
  if (q) orders = orders.filter(o =>
    o.dd.toLowerCase().includes(q) ||
    o.products.some(p => (p.code||'').toLowerCase().includes(q) || (p.full_name||p.name||'').toLowerCase().includes(q))
  );
  document.getElementById('count').textContent = orders.length + ' 单';
  let html = '';
  orders.forEach(o => {
    const prodStr = o.products.slice(0,2).map(p => p.full_name || p.name || p.code).join(', ') + (o.products.length>2?'…':'');
    html += '<div class="order-card">';
    html += '<div class="order-header" onclick="toggleOrder(this)">';
    html += '<div><span class="order-id">' + o.dd + '</span><span class="badge red">' + o.product_count + '个产品</span></div>';
    html += '<div class="order-meta"><span>' + prodStr + '</span><span class="toggle-icon">▶</span></div>';
    html += '</div>';
    html += '<div class="order-body">';
    html += '<table class="sub-table"><thead><tr><th>品号</th><th>品名</th><th>规格</th><th style="text-align:right">数量</th></tr></thead><tbody>';
    o.products.forEach(p => {
      html += '<tr><td class="code">' + p.code + '</td><td class="name">' + (p.full_name||p.name||'') + '</td><td class="name">' + (p.spec||'') + '</td><td class="num">' + (p.qty%1===0?p.qty.toFixed(0):p.qty) + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
  });
  if (!orders.length) html = '<div style="text-align:center;padding:60px;color:var(--text-muted)">无匹配数据</div>';
  document.getElementById('content').innerHTML = html;
}
