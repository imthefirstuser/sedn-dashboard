<title>采购底稿下单情况</title>
<style>
:root {
  --bg:#F4F3F0;--s:#FFF;--b:#E6E5E0;--bl:#EFEEEA;
  --t:#1C1B1A;--ts:#6B6A66;--tm:#A3A29E;
  --r:#C43A31;--rb:#FFF5F5;--a:#C4872B;--ab:#FFFBF0;--g:#1B8A3D;--gb:#F0FFF4;
  --f:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--t);min-height:100vh;font-size:14px;line-height:1.5;padding:32px 0}
.app{max-width:1100px;margin:0 auto;padding:0 20px}
h1{font-size:17px;font-weight:500;margin-bottom:3px}
.sub{font-size:12px;color:var(--tm);margin-bottom:10px}
.stats{display:flex;gap:20px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--bl)}
.stat-v{font-size:27px;font-weight:450;font-feature-settings:"tnum" 1}
.stat-v.red{color:var(--r)}.stat-v.amber{color:var(--a)}
.stat-l{font-size:11px;color:var(--tm)}
.ctrl{display:flex;gap:8px;align-items:center;margin-bottom:24px;font-size:13px;flex-wrap:wrap}
.ctrl input{flex:1;max-width:280px;padding:6px 10px;border:1px solid var(--b);font-size:13px;font-family:var(--f);background:var(--s);outline:none}
.fg{display:flex;gap:4px}
.fb{padding:5px 12px;border:1px solid var(--b);background:var(--s);cursor:pointer;font-size:12px;color:var(--ts);font-family:var(--f)}
.fb.active{background:var(--t);color:var(--s);border-color:var(--t)}
.rc{font-size:12px;color:var(--tm);margin-left:auto}

.oc{background:var(--s);border:1px solid var(--bl);margin-bottom:12px}
.oh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;cursor:pointer}
.oh:hover{background:#FAFAF8}
.oid{font-size:13px;font-weight:500;font-feature-settings:"tnum" 1}
.om{display:flex;gap:14px;font-size:11px;color:var(--ts);align-items:center}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:9px;font-size:10px;font-weight:500;margin-left:8px}
.bdg.r{background:var(--rb);color:var(--r)}.bdg.a{background:var(--ab);color:var(--a)}
.ti{font-size:11px;color:var(--tm);transition:transform .15s}
.ti.open{transform:rotate(90deg)}
.ob{display:none}.ob.open{display:block}
.st{width:100%;border-collapse:collapse;font-size:12px}
.st th{color:var(--ts);font-weight:400;padding:6px 12px;text-align:left;font-size:10px;letter-spacing:.3px;border-bottom:1px solid var(--bl)}
.st td{padding:6px 12px;border-bottom:1px solid var(--bl);font-feature-settings:"tnum" 1}
.st tr:hover{background:#FAFAF8}
.cd{color:var(--ts);font-size:11px}
.nm{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr{text-align:right}
.gap{color:var(--r);font-weight:500}
.sec{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--tm);padding:10px 16px 6px;background:var(--bg)}
@media(max-width:640px){.stats{gap:12px;flex-wrap:wrap}.stat-v{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<div class="header">

  <div class="ctrl">

    <span class="rc" id="ct"></span>

<div id="ctn"></div>
