<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排产看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #fafafa; color: #1a1a1a; min-height: 100vh; }
  .layout { padding: 48px 200px; }
  .back { display: inline-block; font-size: 13px; color: #999; text-decoration: none; margin-bottom: 16px; }
  .back:hover { color: #333; }
  .title { font-size: 32px; font-weight: 700; margin-bottom: 32px; }
  .list { list-style: none; }
  .list li { margin-bottom: 4px; }
  .list a { display: block; padding: 12px 16px; border-radius: 4px; text-decoration: none; color: #1a1a1a; font-size: 14px; transition: background 0.12s; }
  .list a:hover { background: rgba(0,0,0,0.04); }
  .list .date { color: #999; font-size: 12px; margin-left: 8px; }
  .footer { text-align: center; font-size: 11px; color: #ccc; margin-top: 56px; padding-bottom: 24px; }
  @media (max-width: 800px) { .layout { padding: 48px 24px; } }
</style>
</head>
<body>

<div class="layout">
  <a class="back" href="/pages/dashboard.html">← 返回</a>
  <div class="title">排产看板</div>
  <ul class="list" id="files"></ul>
  <div class="footer">身份已验证 · 7天内免登录</div>
</div>

<script>
const OWNER = 'imthefirstuser';
const REPO = 'sedn-dashboard';
const PATH = 'schedule';

async function load() {
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`);
  const items = await res.json();
  const files = items
    .filter(f => f.type === 'file' && /^schedule_/.test(f.name))
    .sort((a, b) => b.name.localeCompare(a.name));

  const ul = document.getElementById('files');
  files.forEach(f => {
    const m = f.name.match(/_(\d{2})(\d{2})\.html/);
    const label = m ? `${m[1]}月${m[2]}日` : f.name;
    const li = document.createElement('li');
    li.innerHTML = `<a href="/sedn-dashboard/schedule/${f.name}">${f.name.replace('.html','')}<span class="date">${label}</span></a>`;
    ul.appendChild(li);
  });
}
load();
</script>
</body>
</html>
