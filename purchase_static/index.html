<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采购历史查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:#f0f2f5;color:#333;padding:15px;min-height:100vh}
.container{max-width:1400px;margin:0 auto}
.search-box{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.search-box h1{font-size:18px;margin-bottom:12px}
.search-box h1 small{font-size:13px;color:#888;font-weight:400}
.search-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.search-row textarea{flex:1;min-width:250px;padding:9px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;outline:none;resize:vertical;min-height:38px;font-family:inherit;line-height:1.5}
.search-row textarea:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.15)}
.search-row button{padding:9px 20px;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.btn-query{background:#1677ff;color:#fff}
.btn-query:hover{background:#4096ff}
.btn-clear{background:#f5f5f5;color:#666}
.btn-clear:hover{background:#e8e8e8}
.status{margin-top:10px;font-size:13px;color:#888;display:flex;align-items:center;gap:5px}
.status .spinner{display:none;width:16px;height:16px;border:2px solid #e8e8e8;border-top-color:#1677ff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status.loading .spinner{display:inline-block}
.hint{font-size:12px;color:#bbb;margin-top:4px}

.result-panel{display:none}
.result-panel.show{display:block}
.summary-table-wrap{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow-x:auto}
.summary-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.summary-table th{background:#fafafa;padding:7px 10px;text-align:center;border-bottom:2px solid #e8e8e8;font-weight:600;position:sticky;top:0;z-index:10}
.summary-table td{padding:6px 10px;text-align:center;border-bottom:1px solid #f5f5f5}
.summary-table tr:hover{background:#f5f7fa}
.summary-table td:first-child{text-align:left;font-weight:500;font-family:"SF Mono","Cascadia Code",monospace}
.summary-table td:nth-child(2){text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.summary-table .th-grp{background:#e6f4ff;font-size:11px;color:#1677ff}
td.num{font-family:"SF Mono","Cascadia Code",monospace}
td.warn{color:#ff4d4f;font-weight:600}
.empty-state{text-align:center;padding:60px 20px;color:#bbb}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:15px}
.hidden{display:none}
.footer{text-align:center;font-size:11px;color:#bbb;margin-top:15px;padding-bottom:15px}
</style>
</head>
<body>
<div class="container">
<div class="search-box">
    <h1>&#128203; 采购历史查询 <small>批量查品号近半年/一年/两年汇总</small></h1>
    <div class="search-row">
        <textarea id="searchInput" placeholder="输入品号（多个用逗号/空格/换行分隔）&#10;如: 110110120397 110101120191 110304000022" rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();search()}"></textarea>
        <div style="display:flex;flex-direction:column;gap:6px">
            <button class="btn-query" id="queryBtn" onclick="search()">查询</button>
            <button class="btn-clear" onclick="clearAll()">清空</button>
        </div>
    </div>
    <div class="hint">支持批量：品号之间用逗号、空格、换行分隔。Shift+Enter 换行，Enter 直接查询。</div>
    <div class="status" id="status"><span class="spinner"></span><span id="statusText">输入品号查询</span></div>
</div>

<div class="result-panel" id="resultPanel">
    <div class="summary-table-wrap">
    <table class="summary-table">
        <thead>
        <tr>
            <th rowspan="2">#</th>
            <th rowspan="2">品号</th>
            <th rowspan="2">品名</th>
            <th rowspan="2">含税单价</th>
            <th colspan="5" class="th-grp">近半年(180天)</th>
            <th colspan="5" class="th-grp">近一年(365天)</th>
            <th colspan="5" class="th-grp">近两年(730天)</th>
        </tr>
        <tr>
            <th>次数</th><th>总用量</th><th>总金额</th><th>次均用量</th><th>次均金额</th>
            <th>次数</th><th>总用量</th><th>总金额</th><th>次均用量</th><th>次均金额</th>
            <th>次数</th><th>总用量</th><th>总金额</th><th>次均用量</th><th>次均金额</th>
        </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    </div>
</div>

<div id="emptyState" class="empty-state hidden">
    <div class="icon">&#128203;</div>
    <p id="emptyText">输入品号开始查询</p>
</div>
<div class="footer">数据来源：ERP DCSHDB 采购明细表</div>
</div>

<script>
var idxData = [];
var dataCache = {};
var loadingChunks = {};

function $(id){return document.getElementById(id)}

function setLoading(l){
    $('status').classList.toggle('loading',l);
    $('queryBtn').disabled=l;
}
function setStatus(m){$('statusText').textContent=m;$('status').classList.remove('loading');}

// 加载索引
fetch('purchase_idx.json').then(function(r){return r.json()}).then(function(data){
    data.forEach(function(it){idxData.push({item_no:it[0], name:it[1]||'', spec:it[2]||''});});
    setStatus('已加载 '+idxData.length+' 个品号索引');
});

// 加载分片
function loadChunk(prefix, callback){
    if (dataCache[prefix] !== undefined) { callback(dataCache[prefix]); return; }
    if (loadingChunks[prefix]) { setTimeout(function(){loadChunk(prefix, callback);},50); return; }
    loadingChunks[prefix] = true;
    fetch('data_'+prefix+'.json').then(function(r){return r.json()}).then(function(data){
        dataCache[prefix] = data;
        loadingChunks[prefix] = false;
        callback(data);
    }).catch(function(){
        if (prefix !== 'other') {
            loadChunk('other', callback);
        } else {
            loadingChunks[prefix] = false;
            callback(null);
        }
    });
}

function getPrefix(itemNo){
    if (itemNo.length >= 4) return itemNo.substring(0,4);
    return itemNo;
}

function fmt(v){
    if (v==null||v===0) return '-';
    return Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4});
}
function fmty(v){
    if (v==null||v===0) return '-';
    return '\u00A5'+Number(v).toLocaleString();
}

function search(){
    var raw = $('searchInput').value.trim();
    if (!raw) { setStatus('请输入品号'); return; }
    // 按逗号、空格、换行、分号、tab 分隔
    var codes = raw.split(/[,;\s\n\r\t]+/).filter(function(s){return s.trim().length>0;});
    if (codes.length === 0) { setStatus('未识别到有效品号'); return; }
    // 去重
    var seen = {};
    codes = codes.filter(function(c){var k=c.trim(); if(seen[k]) return false; seen[k]=true; return true;});

    setLoading(true);
    $('resultPanel').classList.remove('show');
    $('emptyState').classList.add('hidden');
    setStatus('正在查询 '+codes.length+' 个品号...');

    // 逐步加载每个品号的数据
    var results = [];
    var loaded = 0;
    var failed = 0;

    codes.forEach(function(code, idx){
        var item = code.trim();
        var prefix = getPrefix(item);
        loadChunk(prefix, function(data){
            if (data && data[item]) {
                results.push({item_no: item, data: data[item]});
            } else {
                results.push({item_no: item, data: null});
                failed++;
            }
            loaded++;
            if (loaded >= codes.length) {
                setLoading(false);
                renderTable(results);
            } else {
                setStatus('正在查询 '+loaded+'/'+codes.length+'...');
            }
        });
    });
}

function renderTable(results){
    var tbody = $('tableBody');
    if (results.length === 0) {
        $('emptyState').classList.remove('hidden');
        $('emptyText').textContent = '未找到任何品号数据';
        return;
    }

    // 先找到品名信息
    var html = '';
    results.forEach(function(r, i){
        var d = r.data;
        var info = null;
        for (var j = 0; j < idxData.length; j++) {
            if (idxData[j].item_no === r.item_no) { info = idxData[j]; break; }
        }

        if (!d) {
            // 无数据行
            html += '<tr><td>'+(i+1)+'</td><td>'+r.item_no+'</td><td>'+(info?info.name:'')+'</td><td class="num warn">\u2716 \u65E0\u91C7\u8D2D\u6570\u636E</td>';
            html += '<td colspan="14" style="color:#ccc">\u2014</td></tr>';
            return;
        }

        var name = info ? info.name : (d.n||'');
        var spec = info ? info.spec : (d.s||'');
        var unitPrice = d.u || 0;

        function periodCells(s){
            if (!s || s.orders===0){
                return '<td class="num">-</td><td class="num">-</td><td class="num">-</td><td class="num">-</td><td class="num">-</td>';
            }
            return '<td class="num">'+(s.orders||'-')+'</td>'+
                '<td class="num">'+fmt(s.total_qty)+'</td>'+
                '<td class="num">'+fmty(s.total_amt)+'</td>'+
                '<td class="num">'+fmt(s.avg_qty)+'</td>'+
                '<td class="num">'+fmty(s.avg_amt)+'</td>';
        }

        html += '<tr>'+
            '<td>'+(i+1)+'</td>'+
            '<td>'+r.item_no+'</td>'+
            '<td>'+name+'</td>'+
            '<td class="num">'+(unitPrice>0?fmty(unitPrice):'-')+'</td>'+
            periodCells(d.h)+
            periodCells(d.o)+
            periodCells(d.t)+
            '</tr>';
    });

    tbody.innerHTML = html;
    $('resultPanel').classList.add('show');
    setStatus('查询完成：'+results.length+' 个品号'+(results.filter(function(r){return r.data===null;}).length>0?'，其中 '+(results.filter(function(r){return r.data===null;}).length)+' 个无数据':''));
}

function clearAll(){
    $('searchInput').value = '';
    $('searchInput').focus();
    $('resultPanel').classList.remove('show');
    $('emptyState').classList.add('hidden');
    setStatus('输入品号查询');
}
</script>
</body>
</html>
